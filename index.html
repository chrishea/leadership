<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadership Cloudcroft — Year Two</title>
    <meta name="description"
        content="Leadership Cloudcroft cultivates informed, connected, and action-oriented leaders committed to the Village of Cloudcroft. Year Two coming soon.">
    <link rel="icon" type="image/png" href="icon-leadership-circle-white.png">
    <meta property="og:title" content="Leadership Cloudcroft — Year Two">
    <meta property="og:description"
        content="Leadership Cloudcroft cultivates informed, connected, and action-oriented leaders committed to the Village of Cloudcroft. Year Two coming soon.">
    <meta property="og:image" content="https://leadershipcloudcroft.com/icon-leadership-circle-white.png">
    <meta property="og:url" content="https://leadershipcloudcroft.com/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
        rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #5C6147;
            font-family: 'Newsreader', serif;
            text-align: center;
            color: #f1f6f0;
        }

        .logo {
            width: 90%;
            max-width: 500px;
            margin-bottom: 4vh;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin: 0;
            color: #FFDD57;
        }

        .cta {
            display: inline-block;
            margin-top: 2.5rem;
            font-size: 1.05rem;
            letter-spacing: 0.04em;
            color: #f1f6f0;
            text-decoration: underline;
            text-underline-offset: 6px;
            text-decoration-thickness: 1px;
            transition: color 0.2s ease;
        }

        .cta:hover,
        .cta:focus {
            color: #FFDD57;
        }

        footer {
            position: absolute;
            bottom: 2vh;
            font-size: 0.8rem;
            color: #f1f6f0;
        }

        @media only screen and (max-width: 768px) {
            .logo {
                width: 80%;
            }

            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <img class="logo" src="icon-leadership-circle-white.png" alt="Leadership Cloudcroft" />
    <h1>Year Two</h1>
    <a class="cta" href="mailto:info@leadershipcloudcroft.com?subject=Notify%20me%20about%20Year%20Two">Notify me when applications open</a>
    <footer>&copy; Leadership Cloudcroft 2026</footer>
</body>

</html>

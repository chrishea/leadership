<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadership Cloudcroft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #6F7555;
            font-family: 'Newsreader', serif;
            text-align: center;
            color: #f1f6f0;
        }
        .logo {
            width: 90%;
            max-width: 500px;
            margin-bottom: 4vh;
        }
        .coming-soon {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin: 0;
            color: #FFDD57;
        }
        .subtitle {
            font-size: 1.4rem;
            margin-top: 1.5rem;
            font-weight: 400;
            color: #f1f6f0;
        }
        footer {
            position: absolute;
            bottom: 2vh;
            font-size: 0.8rem;
            color: #f1f6f0;
            opacity: 0.6;
        }
        @media only screen and (max-width: 768px) {
            .logo {
                width: 80%;
            }
            .coming-soon {
                font-size: 1.8rem;
            }
            .subtitle {
                font-size: 1.1rem;
                padding: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <img class="logo" src="icon-leadership-circle-white.png" alt="Leadership Cloudcroft" />
    <p class="coming-soon">Coming Soon</p>
    <p class="subtitle">Year Two Agenda</p>
    <footer>&copy; Leadership Cloudcroft 2025</footer>
</body>
</html>
